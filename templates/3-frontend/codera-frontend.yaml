name: "{{PROJECT_NAME}}-frontend"
build:
  command: npm run build
  output: dist
  node_version: "20"
  # The API URL is NOT baked in at build time: the app reads it at runtime
  # from /config.json, which Codera writes per environment from the backend
  # stack's `ApiUrl` output (template.json `config_from`).
  pre_build_commands:
    - aws codeartifact login --tool npm --domain "$CA_DOMAIN" --domain-owner "$CA_DOMAIN_OWNER" --repository "$CA_REPO" --region "$AWS_DEFAULT_REGION"
routing: spa
