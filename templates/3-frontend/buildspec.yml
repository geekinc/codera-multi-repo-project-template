version: 0.2
env:
  variables:
    # Set these as CodeBuild env overrides or via SSM in your pipeline.
    DEPLOY_BUCKET: ""
    CLOUDFRONT_DISTRIBUTION_ID: ""
phases:
  install:
    runtime-versions:
      nodejs: $NODE_VERSION
  pre_build:
    commands:
      - aws codeartifact login --tool npm --domain "$CA_DOMAIN" --domain-owner "$CA_DOMAIN_OWNER" --repository "$CA_REPO" --region "$AWS_DEFAULT_REGION"
      - npm install
  build:
    commands:
      - npm run build
      # Standalone (bootstrap/) pipeline only — Codera builds from
      # codera-frontend.yaml and writes /config.json itself. The app reads the
      # API URL at runtime from /config.json (src/lib/config.ts), so write the
      # backend's SSM-published URL into the built config.json.
      - |
        API_URL=$(aws ssm get-parameter --name "/$PROJECT_NAME/api-base-url" --query "Parameter.Value" --output text 2>/dev/null || echo "")
        if [ -n "$API_URL" ]; then
          node -e 'const fs=require("fs");const f="dist/config.json";const c=JSON.parse(fs.readFileSync(f,"utf8"));c.backend={...(c.backend||{}),RestApiUrl:process.argv[1]};fs.writeFileSync(f,JSON.stringify(c,null,2)+"\n")' "$API_URL"
        else
          echo "No /$PROJECT_NAME/api-base-url in SSM — config.json keeps an empty backend URL."
        fi
  post_build:
    commands:
      - |
        if [ -n "$DEPLOY_BUCKET" ]; then
          aws s3 sync dist/ "s3://$DEPLOY_BUCKET" --delete
          if [ -n "$CLOUDFRONT_DISTRIBUTION_ID" ]; then
            aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"
          fi
        else
          echo "DEPLOY_BUCKET not set — build artifacts left in dist/ only."
        fi
artifacts:
  base-directory: dist
  files:
    - "**/*"
