version: 0.2
phases:
  install:
    runtime-versions:
      nodejs: $NODE_VERSION
  pre_build:
    commands:
      - echo "Authenticating npm to CodeArtifact..."
      - aws codeartifact login --tool npm --domain "$CA_DOMAIN" --domain-owner "$CA_DOMAIN_OWNER" --repository "$CA_REPO" --region "$AWS_DEFAULT_REGION"
      - npm install
  build:
    commands:
      - npm run build
  post_build:
    commands:
      # Publishes, or no-ops only if this exact version is already published
      # with identical content. A changed package under an already-published
      # version, an auth error or a wrong registry FAILS the build — see
      # scripts/publish.sh. Never add `|| true` / `|| echo` here.
      - sh scripts/publish.sh
